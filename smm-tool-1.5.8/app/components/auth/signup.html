<div class="signup-container">
  <div class="signup-form mdl-card mdl-shadow--2dp" style="justify-content: center; margin-left: auto;
  margin-right: auto; margin-top: 200px;">
    <h2 class="mdl-card__title mdl-card__title-text" style="justify-content: center; margin-left: auto;
  margin-right: auto;">Sign Up</h2>
    <form name="signupForm" ng-submit="signup()" novalidate class="mdl-card__supporting-text">
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input
          type="text"
          id="username"
          class="mdl-textfield__input"
          ng-model="signupData.username"
          placeholder="Username"
          required
        />
      </div>

      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input
          type="email"
          id="email"
          class="mdl-textfield__input"
          ng-model="signupData.email"
          placeholder="Email"
          required
        />
      </div>

      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input
          type="password"
          id="password"
          class="mdl-textfield__input"
          ng-model="signupData.password"
          placeholder="Password"
          required
        />
      </div>

      <div class="button">
        <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored"
        style="margin-left: 100px;"
        >
          Sign Up
        </button>
      </div>
    </form>

    <div class="login-link mdl-card__actions">
      <a href="#/login" class="mdl-button mdl-js-button mdl-button--text">Already have an account? Login</a>
    </div>
  </div>
</div>
