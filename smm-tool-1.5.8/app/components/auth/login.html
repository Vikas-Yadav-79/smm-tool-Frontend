<div class="login-container">
  <div class="login-form mdl-card mdl-shadow--2dp" style="
  justify-content: center;
  margin-top: 200px;
  margin-left: auto;
  margin-right: auto;
">
    <h2 class="mdl-card__title mdl-card__title-text" style="justify-content: center; margin-left: auto;
  margin-right: auto;">Login</h2>
    <form name="loginForm" ng-submit="login()" novalidate class="mdl-card__supporting-text">
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input
          type="text"
          id="username"
          class="mdl-textfield__input"
          ng-model="loginData.username"
          placeholder="Username"
          required
        />
      </div>

      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <input
          type="password"
          id="password"
          class="mdl-textfield__input"
          ng-model="loginData.password"
          placeholder="Password"
          required
        />
      </div>

      <div class="button">
        <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored"
        style="margin-left: 100px;" >
          Login
        </button>
      </div>
    </form>

    <div class="signup-link mdl-card__actions">
      <a href="#/signup" class="mdl-button mdl-js-button mdl-button--text">Don't have an account? Sign up</a>
    </div>
  </div>
</div>
