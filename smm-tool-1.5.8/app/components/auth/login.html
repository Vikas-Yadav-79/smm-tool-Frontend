<div class="login-container">

  <div id="top-container">
    
    <div id="logid" class="login-form mdl-card mdl-shadow--2dp" style="
    justify-content: center;
    ">
    <form name="loginForm" ng-submit="login()" novalidate class="mdl-card__supporting-text">
      <h2 id="title" class="mdl-card__title mdl-card__title-text" style="justify-content: center; margin-left: auto;
  margin-right: auto;">Log in</h2>
      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <label for="" style="color: black; padding: 5px; padding-bottom: 1%;">Email Address</label>
        <input type="email" id="username" class="mdl-textfield__input" ng-model="loginData.email" required />
      </div>

      <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
        <label for="" style="color: black; padding: 5px;">Password</label>
        <input type="password" id="password" class="mdl-textfield__input" ng-model="loginData.password" required />
      </div>

      <button id="btn" type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
        Log In
      </button>
    </form>

    <div>
      <a id="fotlink" href="#/signup">Don't have an account? Sign up</a>
    </div>
  </div>

  </div>


  <div class="top-class">
    <div class="svg-text">
      <h2
        style="color: #FFFFFF; font-family:Georgia, 'Times New Roman', Times, serif; font-weight: bolder; margin-left: 100px; margin-right: 210px;">
        Buffer's AI Assistant Becomes Social Media Smart</h2>
      <p
        style="color: #FFFFFF;font-weight: 400; margin-left:100px; margin-right: 510px; font-size: larger; font-family: 'Roboto', sans-serif;">
        Create AI-tailored content, designed specifically for your audience and social network. Available for <u>all plans  </u>
        (including Free)!</p>
    </div>

    <div class="svg-div">

      <img id="svg-image" src="app/assets/images/login-svg.png" alt="Not Found">
    </div>

  </div>


</div>
