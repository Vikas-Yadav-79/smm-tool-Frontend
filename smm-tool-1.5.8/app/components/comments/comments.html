<div class="analytics-container" ng-if="flag">
  <div class="post-analytics">
    <div class="post-image">
      <button
        class="arr"
        style="
          left: 2%;
          position: absolute;
          top: 50%;
          border-radius: 50%;
          display: flex;
          width: 30px;
          height: 30px;
          align-items: center;
          justify-content: center;
        "
        ng-click="goBackward()"
        ng-disabled="imagePage === 0 ||  $ctrl.countImage === 0 "
      >
        <i class="material-icons" style="padding: 0">chevron_left</i>
      </button>
      <button
        class="arr"
        ng-disabled="imagePage === $ctrl.countImage - 1 || $ctrl.countImage === 0"
        style="
          right: 2%;
          position: absolute;
          top: 50%;
          border-radius: 50%;
          display: flex;
          width: 30px;
          height: 30px;
          align-items: center;
          justify-content: center;
        "
        ng-click="goForward()"
      >
        <i class="material-icons" style="padding: 0">chevron_right</i>
      </button>
      <img
        class="post-img"
        ng-src="{{$ctrl.data.image_urls[imagePage]}}"
        alt="Post Image"
      />
    </div>
  </div>

  <div class="comments-section">
    <div style="border-bottom: 1px solid #efefef">
      <h3 class="comments-title">Comments</h3>
      <div style="padding: 16px; overflow-y: scroll; height: 350px">
        <div class="comment" ng-repeat="comment in comments">
          <svg
            ng-if="$ctrl.data.platform === 'Instagram'"
            xmlns="http://www.w3.org/2000/svg"
            x="0px"
            y="0px"
            width="35"
            height="35"
            viewBox="0 0 48 48"
          >
            <radialGradient
              id="yOrnnhliCrdS2gy~4tD8ma_Xy10Jcu1L2Su_gr1"
              cx="19.38"
              cy="42.035"
              r="44.899"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#fd5"></stop>
              <stop offset=".328" stop-color="#ff543f"></stop>
              <stop offset=".348" stop-color="#fc5245"></stop>
              <stop offset=".504" stop-color="#e64771"></stop>
              <stop offset=".643" stop-color="#d53e91"></stop>
              <stop offset=".761" stop-color="#cc39a4"></stop>
              <stop offset=".841" stop-color="#c837ab"></stop>
            </radialGradient>
            <path
              fill="url(#yOrnnhliCrdS2gy~4tD8ma_Xy10Jcu1L2Su_gr1)"
              d="M34.017,41.99l-20,0.019c-4.4,0.004-8.003-3.592-8.008-7.992l-0.019-20	c-0.004-4.4,3.592-8.003,7.992-8.008l20-0.019c4.4-0.004,8.003,3.592,8.008,7.992l0.019,20	C42.014,38.383,38.417,41.986,34.017,41.99z"
            ></path>
            <radialGradient
              id="yOrnnhliCrdS2gy~4tD8mb_Xy10Jcu1L2Su_gr2"
              cx="11.786"
              cy="5.54"
              r="29.813"
              gradientTransform="matrix(1 0 0 .6663 0 1.849)"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#4168c9"></stop>
              <stop offset=".999" stop-color="#4168c9" stop-opacity="0"></stop>
            </radialGradient>
            <path
              fill="url(#yOrnnhliCrdS2gy~4tD8mb_Xy10Jcu1L2Su_gr2)"
              d="M34.017,41.99l-20,0.019c-4.4,0.004-8.003-3.592-8.008-7.992l-0.019-20	c-0.004-4.4,3.592-8.003,7.992-8.008l20-0.019c4.4-0.004,8.003,3.592,8.008,7.992l0.019,20	C42.014,38.383,38.417,41.986,34.017,41.99z"
            ></path>
            <path
              fill="#fff"
              d="M24,31c-3.859,0-7-3.14-7-7s3.141-7,7-7s7,3.14,7,7S27.859,31,24,31z M24,19c-2.757,0-5,2.243-5,5	s2.243,5,5,5s5-2.243,5-5S26.757,19,24,19z"
            ></path>
            <circle cx="31.5" cy="16.5" r="1.5" fill="#fff"></circle>
            <path
              fill="#fff"
              d="M30,37H18c-3.859,0-7-3.14-7-7V18c0-3.86,3.141-7,7-7h12c3.859,0,7,3.14,7,7v12	C37,33.86,33.859,37,30,37z M18,13c-2.757,0-5,2.243-5,5v12c0,2.757,2.243,5,5,5h12c2.757,0,5-2.243,5-5V18c0-2.757-2.243-5-5-5H18z"
            ></path>
          </svg>
          <svg
            ng-if="$ctrl.data.platform === 'Facebook'"
            xmlns="http://www.w3.org/2000/svg"
            x="0px"
            y="0px"
            width="35"
            height="35"
            viewBox="0 0 48 48"
          >
            <path
              fill="#039be5"
              d="M24 5A19 19 0 1 0 24 43A19 19 0 1 0 24 5Z"
            ></path>
            <path
              fill="#fff"
              d="M26.572,29.036h4.917l0.772-4.995h-5.69v-2.73c0-2.075,0.678-3.915,2.619-3.915h3.119v-4.359c-0.548-0.074-1.707-0.236-3.897-0.236c-4.573,0-7.254,2.415-7.254,7.917v3.323h-4.701v4.995h4.701v13.729C22.089,42.905,23.032,43,24,43c0.875,0,1.729-0.08,2.572-0.194V29.036z"
            ></path>
          </svg>
          <div
            style="
              gap: 8px;
              display: flex;
              flex-direction: column;
              width: -webkit-fill-available;
            "
          >
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <div>
                <div class="comment-content">
                  <p style="margin: 0; line-height: 20px">
                    <strong class="author">{{comment.author}}</strong><br />
                    <span class="text">{{comment.text}}</span>
                  </p>
                </div>
                <div class="reply-section">
                  <button
                    class="reply-button"
                    ng-click="$ctrl.replyToComment(comment)"
                  >
                    Reply
                  </button>
                </div>
              </div>
              <div>
                <i
                  class="material-icons"
                  style="color: #8e8e8e; font-size: 22px"
                  >favorite_border</i
                >
              </div>
            </div>
            <button
              style="
                color: #dbdbdb;
                padding: 0 0 0 10px;
                font-size: 12px;
                background: transparent;
                border: none;
                display: flex;
                flex-direction: row;
                align-items: center;
              "
              ng-click="toggleReply(comment.id)"
              ng-if="comment.replies.length > 0"
            >
              <div
                style="border: 1px solid; margin: 0 10px 0 0; width: 26px"
              ></div>
              <span
                ng-if="!showReply(comment.id)"
                style="padding: 0; color: #737373"
                >See all {{comment.replies.length}} replies
              </span>
              <span
                ng-if="showReply(comment.id)"
                style="padding: 0; color: #737373"
                >Hide all replies</span
              >
            </button>
            <div class="replies" ng-if="showReply(comment.id)">
              <ul class="replies-list">
                <li
                  class="comment"
                  ng-repeat="reply in comment.replies"
                  style="
                    flex-direction: row;
                    gap: 1px;
                    justify-content: space-between;
                  "
                >
                  <div>
                    <p style="margin: 0; line-height: 20px">
                      <strong class="reply-author">{{reply.author}}</strong
                      ><br />
                      <span class="reply-text">{{reply.text}}</span>
                    </p>
                    <div class="reply-section">
                      <button
                        class="reply-button"
                        ng-click="$ctrl.replyToComment(reply)"
                      >
                        Reply
                      </button>
                    </div>
                  </div>
                  <div>
                    <i
                      class="material-icons"
                      style="color: #8e8e8e; font-size: 22px"
                      >favorite_border</i
                    >
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      style="
        display: flex;
        height: 35%;
        flex-direction: column;
        justify-content: space-between;
      "
    >
      <div style="gap: 8px; display: flex; padding: 8px; flex-direction: row">
        <spam
          style="
            display: flex;
            width: fit-content;
            flex-direction: column;
            align-items: center;
          "
          ng-click="$ctrl.replyToComment(comment)"
        >
          <i class="material-icons" style="padding: 0; font-size: 27px"
            >favorite_border</i
          >
          {{likes}} like
        </spam>
        <span
          style="
            display: flex;
            width: fit-content;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
          "
          ng-click="$ctrl.replyToComment(comment)"
        >
          <svg
            aria-label="Comment"
            class="x1lliihq x1n2onr6 x5n08af"
            fill="currentColor"
            height="24"
            role="img"
            viewBox="0 0 24 24"
            width="24"
          >
            <title>Comment</title>
            <path
              d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"
              fill="none"
              stroke="currentColor"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
          {{commentsTotal}} comment
        </span>
      </div>
      <div style="padding: 0px 16px; display: flex">
        <span
          style="text-wrap: nowrap; width: min-content; align-content: center"
          >{{commnetreplayto}}</span
        >
        <input
          id="input1"
          class="add_comment"
          style="
            border: none;
            background: transparent;
            font-size: 15px;
            padding: 10px;
            width: 100%;
          "
          placeholder="Add a comment..."
          type="text"
        />
        <button
          class="mdl-button"
          style="color: #0095f6; font-weight: 600"
          on-click="onClickReply()"
        >
          Post
        </button>
      </div>
    </div>
  </div>
</div>
