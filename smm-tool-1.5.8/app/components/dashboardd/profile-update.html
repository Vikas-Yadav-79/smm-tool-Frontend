<div class="signup-container">
    <div id= "sigid" class="signup-form mdl-card mdl-shadow--2dp" style="justify-content: center; margin-left: auto; margin-right: auto; margin-top: 200px;">
        <h2  id="title"  class="mdl-card__title mdl-card__title-text" style="justify-content: center; margin-left: auto; margin-right: auto;">Profile Update</h2>
        <div class="profile-icon">
            <img src="{{updateData.profileImage || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?ixlib=rb-1.2.1&auto=format&fit=crop&w=256&q=80'}}" 
                 alt="Profile" 
                 style="border-radius: 50%; width: 100px; height: 100px; margin-left: 130px;">
        </div>
        <form name="updateForm" ng-submit="update()" novalidate class="mdl-card__supporting-text">
            <!-- Username Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="text" id="username" class="mdl-textfield__input" ng-model="updateData.username" placeholder="Username" required />
            </div>

            <!-- Email Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="email" id="email" class="mdl-textfield__input" ng-model="updateData.email" placeholder="Email" required />
            </div>

            <!-- Password Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="password" id="password" class="mdl-textfield__input" ng-model="updateData.newPassword" placeholder="New Password" />
            </div>

            <!-- Confirm Password Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="password" id="confirmPassword" class="mdl-textfield__input" ng-model="updateData.confirmPassword" placeholder="Confirm New Password" />
            </div>

            <!-- Submit Button -->
                <button id="btn" type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
                    Update
                </button>
        </form>
    </div>


    <div class="bottom-container">

        <div class="non-imgclass">
    
          <!-- <div class="text-class">
            
          </div> -->
      
          <div class="profile-class">
            <p style="color: #FFFFFF; font-family: 'Roboto', sans-serif; font-weight: bolder; font-size:24px; margin-left: 100px; margin-right: 100px; letter-spacing: -0.75px ; line-height: 32px;">
              “With Buffer I can build social content out as far as I want into the future but also tailor campaigns if we see certain trends within the industry.”
            </p>
            <img src="https://static.buffer.com/login/public/img/signup-avatar-publish.png" alt="NA" style="height: 100px; width: 100px; margin-left: 200px;">
            <p style="color: #FFFFFF; font-family: 'Roboto', sans-serif; font-weight: bolder; font-size:medium; margin-left: 200px; margin-top: 2px; margin-bottom: 0px;">Justin Ozanich</p><br>
            <p style="color: #FFFFFF; font-family: 'Roboto', sans-serif; font-weight: bolder; font-size:small; margin-left: 190px; margin-top: 0px; margin-bottom: 0px;">Marketing Manager</p><br>
            <p style="color: #FFFFFF; font-family: 'Roboto', sans-serif; font-weight: bolder; font-size:small; margin-left: 180px; margin-top: 0px; margin-bottom: 0px;">Foster Coffee Company</p>
          </div>
    
        </div>
    
        <div class="img-class">
          <img id="img-id" src="app/assets/images/signup-img.png" alt="">
        </div>
    
      </div>
</div>
