<div class="signup-container">
    <div class="signup-form mdl-card mdl-shadow--2dp" style="justify-content: center; margin-left: auto; margin-right: auto; margin-top: 200px;">
        <h2 class="mdl-card__title mdl-card__title-text" style="justify-content: center; margin-left: auto; margin-right: auto;">Profile Update</h2>
        <div class="profile-icon">
            <img src="{{updateData.profileImage || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?ixlib=rb-1.2.1&auto=format&fit=crop&w=256&q=80'}}" 
                 alt="Profile" 
                 style="border-radius: 50%; width: 100px; height: 100px; margin-left: 110px;">
        </div>
        <form name="updateForm" ng-submit="update()" novalidate class="mdl-card__supporting-text">
            <!-- Username Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="text" id="username" class="mdl-textfield__input" ng-model="updateData.username" placeholder="Username" required />
            </div>

            <!-- Email Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="email" id="email" class="mdl-textfield__input" ng-model="updateData.email" placeholder="Email" required />
            </div>

            <!-- Password Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="password" id="password" class="mdl-textfield__input" ng-model="updateData.newPassword" placeholder="New Password" />
            </div>

            <!-- Confirm Password Field -->
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input type="password" id="confirmPassword" class="mdl-textfield__input" ng-model="updateData.confirmPassword" placeholder="Confirm New Password" />
            </div>

            <!-- Submit Button -->
            <div class="button">
                <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" style="margin-left: 100px;">
                    Update
                </button>
            </div>
        </form>
    </div>
</div>
