<div class="dashboard-container">
  <sidebar></sidebar>
  <div style="width: -webkit-fill-available">
    <subnavbar
      data="$ctrl.selectedTable"
      on-action="$ctrl.changeTabledata(type)"
      on-apply-filter="$ctrl.onApplyFilter(filters)"
    ></subnavbar>

    <table
      ng-if="flag"
      items="items"
      on-action="$ctrl.handleTableAction(action, item)"
    ></table>
  </div>
</div>
