<!DOCTYPE html>
<html lang="en" ng-app="myApp">
  <head>
    <meta charset="UTF-8" />
    <title>Login/Signup App</title>

    <!-- Include AngularJS -->
    <script src="node_modules/angular/angular.min.js"></script>
    <script src="node_modules/angular-route/angular-route.min.js"></script>
    <!-- <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-route.min.js"></script> -->
    <!-- Material files -->
    <!-- MDL CSS -->
    <link rel="stylesheet" href="globle.css" />
    <script src="./app/components/sidebar/sidebar.module.js"></script>
    <script src="./app/components/sidebar/sidebar.component.js"></script>
    <script src="./app/components/subnavbar/subnavbar.module.js"></script>
    <script src="./app/components/subnavbar/subnavbar.component.js"></script>
    <script src="./app/components/table2/table2.module.js"></script>
    <script src="./app/components/table2/table2.component.js"></script>
    <script src="./app/components/comments/comments.module.js"></script>
    <script src="./app/components/comments/comments.component.js"></script>

    <!-- MDL CSS (Material Design Icons and MDL Styles) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.css"
    />

    <!-- MDL JS (Material Design Lite Scripts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>

    <!-- Include Your App Files -->
    <script src="app/app.js"></script>
    <script src="app/controllers/auth.controller.js"></script>

    <!-- Add this to your index.html file -->
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "480761234690688", // Replace with your app ID
          cookie: true,
          xfbml: true,
          version: "v12.0", // Use the latest version
        });
      };

      (function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "facebook-jssdk");
    </script>
  </head>
  <body ng-app="myApp">
    <div ng-view></div>
  </body>
</html>
